<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | escape }}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
<link rel="icon" href="{{ site.baseurl }}/assets/pobsc-shield.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ site.baseurl }}/assets/site.css">
</head>
<body class="locked home">

<div id="curtain"></div>
<button class="skip-intro" id="skip">Skip intro</button>

<a id="logo" href="#top" aria-label="Plainview&ndash;Old Bethpage Soccer Club home">
  <div class="inner"><img src="{{ site.baseurl }}/assets/pobsc-shield.png" alt="" draggable="false"></div>
</a>

{% include nav.html home=true %}

{{ content }}

{% include footer.html %}

<script src="{{ site.baseurl }}/assets/site.js"></script>
<script src="{{ site.baseurl }}/assets/home.js"></script>
</body>
</html>
