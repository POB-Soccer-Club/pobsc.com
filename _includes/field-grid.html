<div class="field-grid">
{% for item in include.items %}
  <div class="field-card">
    <h3>{{ item.name }}</h3>
    {% if item.use %}<span class="use">{{ item.use }}</span>{% endif %}
    <p>{{ item.address }}</p>
    {% if item.description %}<p>{{ item.description }}</p>{% endif %}
    <p><a href="{{ item.map_url }}">Open in Google Maps</a></p>
  </div>
{% endfor %}
</div>
