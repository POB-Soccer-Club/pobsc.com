{% assign cols = include.columns | split: "," %}
<table>
<thead><tr>{% for col in cols %}<th>{{ col }}</th>{% endfor %}</tr></thead>
<tbody>
{% for person in include.people %}
<tr>
  <td>{{ person.role }}</td>
  <td{% unless person.name %} class="muted"{% endunless %}>{{ person.name | default: "—" }}</td>
  <td{% unless person.phone %} class="muted"{% endunless %}>{{ person.phone | default: "—" }}</td>
  <td{% unless person.email %} class="muted"{% endunless %}>{% if person.email %}<a href="mailto:{{ person.email }}">{{ person.email }}</a>{% else %}—{% endif %}</td>
</tr>
{% endfor %}
</tbody>
</table>
