<div class="field-grid">
{% for person in include.people %}
  <div class="field-card">
    <h3>{{ person.role }}</h3>
    {% if person.name %}<p>{{ person.name }}</p>{% endif %}
    {% if person.phone %}<p><a href="tel:{{ person.phone }}">{{ person.phone }}</a></p>{% endif %}
    {% if person.email %}<p><a href="mailto:{{ person.email }}">{{ person.email }}</a></p>{% endif %}
  </div>
{% endfor %}
</div>
